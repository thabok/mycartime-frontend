<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carpool Planner for Teachers</title>
    <meta name="description"
        content="Plan and manage teacher carpools with automatic schedule-based party generation for 2-week cycles. Easy member management and driving plan optimization.">
    <meta property="og:description"
        content="Plan and manage teacher carpools with automatic schedule-based party generation for 2-week cycles. Easy member management and driving plan optimization.">
    <meta name="twitter:description"
        content="Plan and manage teacher carpools with automatic schedule-based party generation for 2-week cycles. Easy member management and driving plan optimization.">
    <meta name="author" content="Thabo Krick" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="/" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta property="og:title" content="Carpool Planner for Teachers">
    <meta name="twitter:title" content="Carpool Planner for Teachers">
    <style>
        /*
         * Pure CSS/HTML so it paints the instant the window appears, before
         * the JS bundle has parsed or the backend sidecar has finished
         * starting up - main.tsx removes this once the app is ready to
         * render. Without it the window shows a blank white page for
         * however long backend startup takes.
         */
        #splash {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            font-family: system-ui, -apple-system, sans-serif;
            color: #4b5563;
            background: #ffffff;
        }

        #splash .spinner {
            width: 2rem;
            height: 2rem;
            border: 3px solid #e5e7eb;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: splash-spin 0.8s linear infinite;
        }

        @keyframes splash-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="splash">
        <div class="spinner"></div>
        <div>Starting Carpool Planner…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
